openapi: 3.1.0
info:
  title: Bitwage Partner API
  version: "2.0"
  description: |
    The Bitwage Partner API allows you to integrate Bitwage payroll and payment
    functionality into your own application. You can manage users, companies,
    distributions, payroll, and more.
  contact:
    name: Development Team
    email: developers@bitwage.com
    url: https://www.bitwage.com/support
  license:
    name: Copyright Bitwage, Inc. All rights reserved.
    url: https://www.bitwage.com/policies/#terms

servers:
  - url: https://api.sandbox.bitwage.com
    description: Sandbox
  - url: https://api2.bitwage.com
    description: Production

security:
  - api_key: []
  - oauth: []

tags:
  - name: Authorization
    description: OAuth 2.0 authorization code flow endpoints.
  - name: Users
    description: Create and manage user accounts.
  - name: User Documents
    description: Upload and manage user KYC documents.
  - name: User Payers
    description: Manage external payers (employers/clients) for users.
  - name: User Distributions
    description: Manage payment distribution destinations for users.
  - name: User Funding
    description: Manage funding (virtual bank) accounts for users.
  - name: Companies
    description: Create and manage company accounts, UBO, KYC/KYB.
  - name: Company Workers
    description: Invite and manage company workers.
  - name: Company Recipients
    description: Manage company recipients (workers and vendors).
  - name: Company Payroll
    description: Create and manage payrolls.
  - name: Merchant
    description: Crypto pay-in and BTC checkout endpoints.
  - name: Wallets
    description: Request and view wallets for payroll funding.
  - name: Webhooks
    description: Webhook event schemas sent by Bitwage.

paths:
  # ──────────────────────────────────────────────
  # Authorization
  # ──────────────────────────────────────────────
  /authorize:
    get:
      operationId: oauthAuthorize
      tags: [Authorization]
      summary: Request authorization code
      description: |
        OAuth 2.0 authorization code step. Called after a user grants access
        in the Bitwage client. Returns a redirect URI containing the
        authorization code.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Your OAuth app client ID.
        - name: client_state
          in: query
          required: true
          schema:
            type: string
          description: CSRF token from the client for security validation.
      responses:
        "200":
          description: Redirect URI with authorization code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_uri:
                    type: string
                    description: "URI in the format: `{redirect_uri}?code={code}&state={client_state}`"

  /oauth2/token:
    post:
      operationId: oauthToken
      tags: [Authorization]
      summary: Exchange authorization code for access token
      description: |
        Exchange the authorization code received from `/authorize` for an
        access token. The access token is used in subsequent API requests.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: Access token returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"

  # ──────────────────────────────────────────────
  # Users
  # ──────────────────────────────────────────────
  /api/user/create:
    post:
      operationId: createUser
      tags: [Users]
      summary: Create user
      description: Create a new user on behalf of a partner. Currently only `worker` product type is supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "200":
          description: User created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string

  /api/user/update:
    post:
      operationId: updateUser
      tags: [Users]
      summary: Update user
      description: Update an existing user's profile data. All fields except `user_id` are optional (partial update).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/user/detail:
    get:
      operationId: getUserDetail
      tags: [Users]
      summary: Get user details
      description: Retrieve profile details for a Bitwage user.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: User ID for Bitwage user.
      responses:
        "200":
          description: User details returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"

  /api/user/kyc-initiate:
    post:
      operationId: initiateUserKyc
      tags: [Users]
      summary: Initiate user KYC
      description: Initiate KYC verification for a user through the identity verification provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        "200":
          description: KYC initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string

  # ──────────────────────────────────────────────
  # User Documents
  # ──────────────────────────────────────────────
  /api/user/document/upload:
    post:
      operationId: uploadUserDocument
      tags: [User Documents]
      summary: Upload user document
      description: |
        Upload a KYC document or update tax ID for a user. The request shape
        depends on the `doc_type`:
        - For `tax_id`: provide `tax_id` and `tax_id_type` fields.
        - For image documents: provide `category`, `issuing_country`, and `base64_image`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDocumentUploadRequest"
      responses:
        "200":
          description: Document uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/user/document/list:
    get:
      operationId: listUserDocuments
      tags: [User Documents]
      summary: List user documents
      description: List all documents uploaded for a user, including tax ID if available.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserDocument"

  /api/user/document/types:
    get:
      operationId: getUserDocumentTypes
      tags: [User Documents]
      summary: Get required document types
      description: Get the required KYC document types based on the user's country and payer currency.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: external_company_id
          in: query
          required: true
          schema:
            type: string
          description: Payer ID.
      responses:
        "200":
          description: Required document types returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequiredDocTypesResponse"

  # ──────────────────────────────────────────────
  # User Payers
  # ──────────────────────────────────────────────
  /api/user/payer/create:
    post:
      operationId: createUserPayer
      tags: [User Payers]
      summary: Create payer
      description: |
        Create an external payer (employer or client) for a user.
        Required fields vary based on `company_type`. `payroll_invoice_currency`
        must be `EUR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPayerCreateRequest"
      responses:
        "200":
          description: Payer created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_company_id:
                    type: string

  /api/user/payer/update:
    post:
      operationId: updateUserPayer
      tags: [User Payers]
      summary: Update payer
      description: Update an existing external payer for a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPayerUpdateRequest"
      responses:
        "200":
          description: Payer updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_company_id:
                    type: string

  /api/user/payer/delete:
    post:
      operationId: deleteUserPayer
      tags: [User Payers]
      summary: Delete payer
      description: Soft-delete an external payer for a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, external_company_id]
              properties:
                user_id:
                  type: string
                external_company_id:
                  type: string
                  description: Payer ID.
      responses:
        "200":
          description: Payer deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_company_id:
                    type: string

  /api/user/payer/detail:
    get:
      operationId: getUserPayerDetail
      tags: [User Payers]
      summary: Get payer details
      description: Get details for a specific external payer associated with a user.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: external_company_id
          in: query
          required: true
          schema:
            type: string
          description: Payer ID.
      responses:
        "200":
          description: Payer details returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPayer"

  /api/user/payer/list:
    get:
      operationId: listUserPayers
      tags: [User Payers]
      summary: List payers
      description: List all external payers for a user.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payer list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payers:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPayer"

  # ──────────────────────────────────────────────
  # User Distributions
  # ──────────────────────────────────────────────
  /api/user/distribution/fields:
    get:
      operationId: getDistributionFields
      tags: [User Distributions]
      summary: Get distribution fields
      description: Get the required fields for creating a fiat distribution based on the user's country and currency.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: Target currency code (e.g. USD, EUR, BRL).
      responses:
        "200":
          description: Required fields returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                  country:
                    type: string
                    description: ISO 3166-1 alpha-3 country code.
                  required_fields:
                    type: array
                    items:
                      type: object
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/user/distribution:
    post:
      operationId: createUserDistribution
      tags: [User Distributions]
      summary: Create distribution
      description: Create a new payment distribution destination for a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDistributionCreateRequest"
      responses:
        "200":
          description: Distribution created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  distribution_id:
                    type: string
                  allocation:
                    type: integer
    delete:
      operationId: deleteUserDistribution
      tags: [User Distributions]
      summary: Delete distribution
      description: Delete a user's distribution. The distribution's allocation must be 0 before deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, distribution_id]
              properties:
                user_id:
                  type: string
                distribution_id:
                  type: string
      responses:
        "200":
          description: Distribution deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  distribution_id:
                    type: string

  /api/user/distribution/allocations:
    patch:
      operationId: updateUserDistributionAllocations
      tags: [User Distributions]
      summary: Update distribution allocations
      description: |
        Update allocation percentages across a user's distributions.
        Total allocation must equal exactly 100. Maximum 3 distributions.
        Distributions not included in the request will have their allocation set to 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAllocationsRequest"
      responses:
        "200":
          description: Allocations updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      $ref: "#/components/schemas/AllocationItem"

  /api/user/distribution/detail:
    get:
      operationId: getUserDistributionDetail
      tags: [User Distributions]
      summary: Get distribution details
      description: Get details of a specific distribution for a user.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: distribution_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Distribution details returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDistribution"

  /api/user/distribution/list:
    get:
      operationId: listUserDistributions
      tags: [User Distributions]
      summary: List distributions
      description: List all distributions for a user.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Distribution list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserDistribution"

  # ──────────────────────────────────────────────
  # User Funding
  # ──────────────────────────────────────────────
  /api/user/funding/account:
    post:
      operationId: createFundingAccount
      tags: [User Funding]
      summary: Create funding account
      description: |
        Create a funding (virtual bank) account for a user. Supported for EUR
        payers only. The user must be KYC approved and have at least one
        distribution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundingAccountCreateRequest"
      responses:
        "200":
          description: Funding account creation initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
    get:
      operationId: getFundingAccount
      tags: [User Funding]
      summary: Get funding account details
      description: Get bank account details for a user's funding account based on payer currency.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: external_company_id
          in: query
          required: true
          schema:
            type: string
          description: Payer ID.
      responses:
        "200":
          description: Funding account details returned. Response is keyed by currency.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FundingAccountUSD"
                  - $ref: "#/components/schemas/FundingAccountEUR"

  # ──────────────────────────────────────────────
  # Companies
  # ──────────────────────────────────────────────
  /api/companies:
    post:
      operationId: createCompany
      tags: [Companies]
      summary: Create company
      description: Create a new company via the Partner API. Supports idempotency.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "200":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCreateResponse"
        "400":
          description: |
            A business rule rejected the request. Codes: `idempotency-key-required`,
            `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company:
    get:
      operationId: getCompanyDetail
      tags: [Companies]
      summary: Get company details
      description: Get company profile details.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
          description: Company ID from OAuth response.
      responses:
        "200":
          description: Company details returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetailResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/companies/{company_id}/ubo:
    post:
      operationId: createCompanyUbo
      tags: [Companies]
      summary: Create UBO admin
      description: Create a UBO (Ultimate Beneficial Owner) admin for a partner-created company.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UboCreateRequest"
      responses:
        "200":
          description: UBO admin created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id:
                    type: string
                  status:
                    type: string
        "400":
          description: |
            Codes: `company-ubo-admin-already-exists`, `idempotency-key-required`,
            `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/companies/{company_id}/ubo/kyc:
    post:
      operationId: submitCompanyUboKyc
      tags: [Companies]
      summary: Submit UBO KYC
      description: Submit the UBO admin's KYC verification for a partner-created company.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invoke:
                  type: boolean
                  default: true
                  description: Whether to invoke the KYC check immediately.
      responses:
        "200":
          description: UBO KYC submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id:
                    type: string
                  kyc_status:
                    type: string
        "400":
          description: |
            Codes: `company-ubo-admin-not-found`, `ubo-kyc-submit-failed` (retryable),
            `idempotency-key-required`, `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/companies/{company_id}/documents:
    post:
      operationId: uploadCompanyDocuments
      tags: [Companies]
      summary: Upload company documents
      description: |
        Upload documents for UBO admin KYC or company KYB verification.
        The `target_type` field determines the document destination and
        required fields.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyDocumentUploadRequest"
      responses:
        "200":
          description: Document uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDocumentUploadResponse"
        "400":
          description: |
            Codes: `invalid-target-type`, `company-ubo-admin-not-found`,
            `user_update_advanced_data_failed`, `document-request-not-found`,
            `document-request-company-mismatch`, `document-request-already-answered`,
            `idempotency-key-required`, `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/companies/{company_id}/kyb:
    post:
      operationId: submitCompanyKyb
      tags: [Companies]
      summary: Submit company KYB
      description: Submit a partner company KYB profile to the verification provider.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invoke:
                  type: boolean
                  default: true
                  description: Whether to invoke the KYB check immediately.
      responses:
        "200":
          description: KYB submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyKybResponse"
        "400":
          description: |
            Codes: `company-kyb-requirements-missing` (`data.requirements.outstanding`
            lists what is missing), `kyb-provider-submit-failed` (retryable),
            `idempotency-key-required`, `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: getCompanyKybStatus
      tags: [Companies]
      summary: Get KYB status
      description: Get the company's KYB verification status and any outstanding requirements.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
      responses:
        "200":
          description: KYB status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyKybResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────
  # Company Workers
  # ──────────────────────────────────────────────
  /api/company/workers:
    get:
      operationId: listCompanyWorkers
      tags: [Company Workers]
      summary: List company workers
      description: Get a paginated list of company workers.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by worker user ID.
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter by worker email.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated worker list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Worker"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/workers/invite:
    post:
      operationId: inviteCompanyWorkers
      tags: [Company Workers]
      summary: Invite workers
      description: Send invitations to workers to join the company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, to_invite]
              properties:
                company_id:
                  type: string
                to_invite:
                  type: array
                  items:
                    type: object
                    required: [email, role]
                    properties:
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [contractor, employee, vendor]
                      external_id:
                        type: string
      responses:
        "200":
          description: Invitations sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "400":
          description: |
            Codes: `company-admin-not-found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/worker/invite/resend:
    post:
      operationId: resendWorkerInvite
      tags: [Company Workers]
      summary: Resend worker invitation
      description: Resend an invitation to a company worker. Maximum 3 resends allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, email]
              properties:
                company_id:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Invitation resent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/worker/invitations:
    get:
      operationId: listWorkerInvitations
      tags: [Company Workers]
      summary: List worker invitations
      description: Get all pending worker invitations for a company.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkerInvitation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # ──────────────────────────────────────────────
  # Company Recipients
  # ──────────────────────────────────────────────
  /api/company/recipients:
    get:
      operationId: listCompanyRecipients
      tags: [Company Recipients]
      summary: List company recipients
      description: Get company recipients (workers and vendors) with filtering and pagination.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by name or email.
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [contractor, employee, vendor]
        - name: recipient_type
          in: query
          required: false
          schema:
            type: string
            enum: [user, company]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, pending, inactive]
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: 2-letter ISO country code.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [name, email, created]
        - name: sort_by_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Recipient list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recipient"
                  meta:
                    oneOf:
                      - $ref: "#/components/schemas/Pagination"
                      - type: "null"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/{company_id}/recipients/create:
    post:
      operationId: createCompanyRecipient
      tags: [Company Recipients]
      summary: Create recipient
      description: |
        Create and link a no-login company recipient: a contractor, an employee,
        or a vendor. Provide `worker` for `contractor` or `employee`, or `vendor`
        for `vendor`. The recipient is created under your partner account, which is
        how their payment webhooks are routed to you. Supports idempotency.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientCreateRequest"
      responses:
        "200":
          description: Recipient created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientCreateResponse"
        "400":
          description: |
            Codes: `recipient-worker-email-already-exists`, `recipient-external-id-already-used`,
            `recipient-already-linked-with-different-role`, `recipient-vendor-already-exists`,
            `idempotency-key-required`, `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/{company_id}/recipients/{recipient_id}/distribution:
    post:
      operationId: createRecipientDistribution
      tags: [Company Recipients]
      summary: Create recipient distribution
      description: Create a distribution (payment destination) for a company recipient.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/RecipientIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientDistributionCreateRequest"
      responses:
        "200":
          description: Distribution created for recipient.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: |
            Codes: `recipient-not-found`, `idempotency-key-required`,
            `idempotency-key-reused-with-different-payload`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteRecipientDistribution
      tags: [Company Recipients]
      summary: Delete recipient distribution
      description: Delete a distribution for a company recipient. The allocation must be 0 before deletion.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/RecipientIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [distribution_id]
              properties:
                distribution_id:
                  type: string
      responses:
        "200":
          description: Distribution deleted.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: |
            Codes: `recipient-not-found`, `distribution_not_found`,
            `distribution-ownership-mismatch`, `delete_distribution_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/{company_id}/recipients/{recipient_id}/distribution/allocations:
    patch:
      operationId: setRecipientDistributionAllocations
      tags: [Company Recipients]
      summary: Set recipient distribution allocations
      description: |
        Set allocation percentages for a company recipient's distributions.
        Total must equal 100. Maximum 3 distributions.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - $ref: "#/components/parameters/RecipientIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocations]
              properties:
                allocations:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    $ref: "#/components/schemas/AllocationItem"
      responses:
        "200":
          description: Allocations updated.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: |
            Codes: `recipient-not-found`, `distribution_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # ──────────────────────────────────────────────
  # Company Payroll
  # ──────────────────────────────────────────────
  /api/company/payroll/create:
    post:
      operationId: createPayroll
      tags: [Company Payroll]
      summary: Create payroll
      description: |
        Create a payroll to pay company workers or vendors. This call creates the
        payroll and returns its `payroll_id`, fees, and, for crypto funding, a
        funding quote. It is the only moment a payroll is "created": Bitwage does
        not send a webhook for creation.

        Track the payroll afterwards with the
        [`company.payroll_status` and `user.payment_status_update` webhooks](/guides/webhooks)
        or by polling [`GET /api/company/{company_id}/payrolls/{payroll_id}`](/api-reference/company-payroll/get-payroll).

        - Send `to_pay` with one item per recipient. Each item has exactly one of
          `user_id` or `company_id`.
        - Send `funding_method` explicitly. Partners can't set a company default.
        - `external_id` must be unique across payrolls.
        - When using API key authentication, an `Idempotency-Key` header is required.
          `POST /api/company/workers/pay` is an alias of this route.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollCreateRequest"
      responses:
        "200":
          description: Payroll created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollCreateResponse"
        "400":
          description: |
            Codes: `idempotency-key-required` (API key auth),
            `idempotency-key-reused-with-different-payload`. Payroll validation failures
            are `422`. See the [Errors guide](/guides/errors#payroll).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/payroll/fees:
    get:
      operationId: getPayrollFees
      tags: [Company Payroll]
      summary: Get estimated payroll fees
      description: |
        Estimate fees for a payroll before you create it. When the funding is a
        balance account, a `quote` is returned. Pass its `id` as `quote_id` to
        [Create payroll](/api-reference/company-payroll/create-payroll) to lock
        the rate and fees.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: Payroll currency.
        - name: generic_funding_method
          in: query
          required: true
          schema:
            type: string
          description: Generic funding method, for example `custodial_account`.
        - name: amount
          in: query
          required: true
          schema:
            type: number
          description: Payroll amount in the payroll currency.
        - name: funding_currency
          in: query
          required: false
          schema:
            type: string
          description: Required for wallet and crypto funding methods.
      responses:
        "200":
          description: Fee estimate returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fees:
                    type: string
                  total:
                    type: string
                  quote:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      base_currency:
                        type: string
                      quote_currency:
                        type: string
                      total_amount_in_funding_currency:
                        type: string
                      valid_to:
                        type: string
                        nullable: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/{company_id}/payrolls:
    get:
      operationId: listPayrolls
      tags: [Company Payroll]
      summary: List payrolls
      description: |
        List a company's worker payrolls, newest first. Filter by `external_id` to
        find a payroll without storing the Bitwage `payroll_id`. Vendor payrolls
        and balance-account withdrawals are not included. Requires the
        `payroll.read` permission group.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - name: external_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Payrolls returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PartnerPayroll"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/company/{company_id}/payrolls/{payroll_id}:
    get:
      operationId: getPayroll
      tags: [Company Payroll]
      summary: Get payroll
      description: |
        Get a worker payroll and the status of each payment in it. `status` is the
        same value as `company.payroll_status`. Each item in `payments` is the
        same object as `payment` on `user.payment_status_update`, so you can
        reconcile a missed delivery. Vendor payrolls and balance-account
        withdrawals are not included. Requires the `payroll.read` permission group.

        Errors: `payroll-not-found` (`404`) when the payroll doesn't exist,
        belongs to another company, or is a vendor payroll or withdrawal.
      parameters:
        - $ref: "#/components/parameters/CompanyIdPath"
        - name: payroll_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payroll returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerPayroll"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/company/payroll/quote/refresh:
    post:
      operationId: refreshPayrollQuote
      tags: [Company Payroll]
      summary: Refresh payroll quotes
      description: Refresh expired crypto funding quotes for a payroll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payroll_id]
              properties:
                payroll_id:
                  type: string
      responses:
        "200":
          description: Payroll quotes refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollQuoteRefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/vendor/payroll/quotes:
    post:
      operationId: createVendorPayrollQuotes
      tags: [Company Payroll]
      summary: Create vendor payroll quotes
      description: |
        Create FX quotes for a vendor payroll funded from a company wallet.
        This endpoint supports API key authentication only.
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorPayrollQuotesRequest"
      responses:
        "200":
          description: Vendor payroll quotes created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPayrollQuotesResponse"

  /api/vendor/payroll/documents:
    post:
      operationId: createVendorPayrollDocumentUpload
      tags: [Company Payroll]
      summary: Create vendor payroll document upload
      description: |
        Create a presigned upload session for a vendor payment invoice.
        Upload the document to the returned `upload_url`, then pass the returned
        `invoice_upload_id` on the matching vendor payment when creating the
        vendor payroll. This endpoint supports API key authentication only.
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorPayrollDocumentUploadRequest"
      responses:
        "200":
          description: Vendor payroll document upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPayrollDocumentUploadResponse"

  /api/vendor/payroll:
    post:
      operationId: createVendorPayroll
      tags: [Company Payroll]
      summary: Create vendor payroll
      description: |
        Create a vendor payroll from previously created vendor quote IDs. An
        `invoice_upload_id` is required for each vendor payment whose quoted USD
        subtotal is greater than or equal to 15000.
        This endpoint supports API key authentication only.
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorPayrollCreateRequest"
      responses:
        "200":
          description: Vendor payroll created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPayrollCreateResponse"

  # ──────────────────────────────────────────────
  # Merchant
  # ──────────────────────────────────────────────
  /api/merchant/claim/create:
    post:
      operationId: createMerchantClaim
      tags: [Merchant]
      summary: Create merchant claim
      description: Create a merchant claim and a claim-scoped crypto quote for BTC checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantClaimCreateRequest"
      responses:
        "200":
          description: Claim and quote created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantClaimCreateResponse"

  /api/merchant/claim/quote/refresh:
    post:
      operationId: refreshMerchantClaimQuote
      tags: [Merchant]
      summary: Refresh merchant claim quote
      description: Refresh an expired quote for an existing merchant claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantClaimQuoteRefreshRequest"
      responses:
        "200":
          description: Quote refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantClaimQuoteRefreshResponse"

  /api/merchant/claim/status:
    get:
      operationId: getMerchantClaimStatus
      tags: [Merchant]
      summary: Get merchant claim status
      description: Get the current BTC checkout status for a merchant claim.
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
        - name: claim_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claim status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantClaimStatusResponse"

  # ──────────────────────────────────────────────
  # Wallets
  # ──────────────────────────────────────────────
  /api/wallets/request:
    post:
      operationId: requestWallet
      tags: [Wallets]
      summary: Request wallet
      description: |
        Request a wallet for a partner-provisioned company.
        This endpoint supports API key authentication only.
      security:
        - api_key: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, currency]
              properties:
                company_id:
                  type: string
                  description: Company ID that the wallet should be requested for.
                currency:
                  type: string
                  description: Wallet currency, for example `USD` or `EUR`.
      responses:
        "200":
          description: Wallet request created or already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, in_progress, completed, rejected]

  /api/wallets:
    get:
      operationId: listWallets
      tags: [Wallets]
      summary: List wallets
      description: |
        List active wallets that can be used to fund payrolls for a
        partner-provisioned company. Use the returned `id` as the
        `funding_method` for vendor quote and payroll creation.
      security:
        - api_key: []
      parameters:
        - name: company_id
          in: query
          required: true
          schema:
            type: string
          description: Company ID to retrieve wallets for.
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: Optional wallet currency filter, for example `USD`.
      responses:
        "200":
          description: Wallets returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Use this value as `funding_method` for vendor quote and payroll creation.
                          example: custodial_account_123
                        balance:
                          type: string
                        currency:
                          type: string
                        is_default:
                          type: boolean
                        status:
                          type: string
                          enum: [pending, in_progress, completed, rejected]

  /api/wallets/transactions:
    get:
      operationId: listWalletTransactions
      tags: [Wallets]
      summary: List wallet transactions
      description: |
        List transactions for a wallet by wallet ID. The partner
        must have access to the company that owns the wallet.
      security:
        - api_key: []
      parameters:
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
          description: Wallet ID.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Number of transactions per page.
      responses:
        "200":
          description: Wallet transactions returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Transaction ID.
                        created:
                          type: string
                          nullable: true
                        amount:
                          type: string
                          nullable: true
                        fee_amount:
                          type: string
                          nullable: true
                        fee_currency:
                          type: string
                          nullable: true
                        currency:
                          type: string
                        status:
                          type: string
                        type:
                          type: string
                        tx_hash:
                          type: string
                          nullable: true
                  pagination:
                    $ref: "#/components/schemas/Pagination"

# ──────────────────────────────────────────────
# Webhooks
# ──────────────────────────────────────────────
# Each webhook is sent once. Bitwage does not retry. Return 200 within 20 seconds.
# Headers: x-bitwage-signature (HMAC-SHA256) and x-bitwage-version: 1.0.
# See the Webhooks guide for signature validation.
webhooks:
  companyPayrollStatus:
    post:
      tags: [Webhooks]
      summary: Payroll status
      description: |
        Sent every time a payroll changes status, starting with `created`. It is not a one-time creation event.
        Statuses can repeat or go back when an action is reversed. Use `GET /api/company/{company_id}/payrolls/{payroll_id}` to reconcile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: company.payroll_status
                data:
                  type: object
                  properties:
                    payroll_id:
                      type: string
                    company_id:
                      type: string
                    status:
                      $ref: "#/components/schemas/PayrollStatus"
                    invoice_ids:
                      type: array
                      nullable: true
                      items:
                        type: string
                    payments:
                      type: array
                      items:
                        type: object
                        properties:
                          subpayroll_id:
                            type: string
                          user_id:
                            type: string
                            nullable: true
                          volume_input_in_input_currency:
                            type: number
                            format: double
                          invoice_id:
                            type: string
                            nullable: true
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  userPaymentStatusUpdate:
    post:
      tags: [Webhooks]
      summary: Payment status update
      description: |
        Sent when a payment changes status. Two things trigger it, so you can receive the same `status` more than once for a payment:

        - A payroll status change sends one event per payment in the payroll. `status` is the payroll status: `created`, `received`, `processing`, `fulfilled`, or `canceled`.
        - A payment status change sends one event for that payment. `status` is `released`, `processing` (a release was reversed), or `fulfilled`.

        Handle events idempotently, keyed on `subpayroll_id` and `status`. For a recipient you created, `payment.outputs` includes only the payouts to distributions you created for them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: user.payment_status_update
                data:
                  type: object
                  properties:
                    subpayroll_id:
                      type: string
                    claim_id:
                      type: string
                      nullable: true
                      description: The claim (invoice) this payment pays. Null when the payment is not linked to a claim.
                    user_id:
                      type: string
                      nullable: true
                      description: The recipient.
                    company_id:
                      type: string
                      description: The paying company.
                    status:
                      type: string
                      enum: [created, received, processing, released, fulfilled, canceled]
                    payment:
                      $ref: "#/components/schemas/Payment"
            example:
              event: user.payment_status_update
              data:
                subpayroll_id: "9876543210"
                claim_id: null
                user_id: "1234567890"
                company_id: "2693034771782348"
                status: released
                payment:
                  subpayroll_id: "9876543210"
                  receiver_user_id: "1234567890"
                  received: true
                  received_at: "2026-11-10T16:02:11+00:00"
                  released: true
                  released_at: "2026-11-10T18:30:45+00:00"
                  fulfilled: false
                  fulfilled_at: null
                  outputs:
                    - input_currency: USD
                      output_currency: BTC
                      volume_input_in_input_currency: 500.0
                      volume_output_in_output_currency: 0.005
                      fees: 2.5
                      spread: 0.0
                      tx_hash: null
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  userKYCStatusUpdate:
    post:
      tags: [Webhooks]
      summary: User KYC status update
      description: Sent when a user's KYC verification status changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: user.kyc_status_update
                data:
                  type: object
                  properties:
                    user_id:
                      type: string
                    kyc_verification_status:
                      type: string
                      enum: [pending, approved, rejected, unapproved, neutral]
                      description: "`neutral` means the case is in manual review."
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  companyKYCStatusUpdate:
    post:
      tags: [Webhooks]
      summary: Company KYC status update
      description: Sent when a company's verification status changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: company.kyc_status_update
                data:
                  type: object
                  properties:
                    company_id:
                      type: string
                    kyc_verification_status:
                      type: string
                      enum: [pending, approved, rejected, unapproved, neutral]
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  claimDetection:
    post:
      tags: [Webhooks]
      summary: Claim detection
      description: Sent when funds for a merchant claim are detected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: claim.detection
                data:
                  type: object
                  properties:
                    claim_id:
                      type: string
                    company_id:
                      type: string
                    status:
                      type: string
                      example: detected
                    currency:
                      type: string
                    amount:
                      type: number
                      format: double
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  walletEvent:
    post:
      tags: [Webhooks]
      summary: Balance account event
      description: |
        Sent for balance account activity. `event` is one of `wallet.request`, `wallet.deposit`,
        `wallet.lightning_deposit`, or `wallet.crypto_withdrawal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum: [wallet.request, wallet.deposit, wallet.lightning_deposit, wallet.crypto_withdrawal]
                data:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [completed, failed, action_required]
                    occurred_at:
                      type: string
                      format: date-time
                    wallet_id:
                      type: string
                    company_id:
                      type: string
                      nullable: true
                    user_id:
                      type: string
                      nullable: true
                    external_id:
                      type: string
                      nullable: true
                    error_code:
                      type: string
                      nullable: true
                      description: Set when `status` is `failed`.
                    error_message:
                      type: string
                      nullable: true
                      description: Set when `status` is `failed`.
                    transaction_id:
                      type: string
                      description: Deposits and withdrawals.
                    currency:
                      type: string
                    amount:
                      type: string
                      description: Deposits and withdrawals, as a decimal string.
                    rail:
                      type: string
                    tx_hash:
                      type: string
                      nullable: true
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

# ──────────────────────────────────────────────
# Components
# ──────────────────────────────────────────────
components:
  securitySchemes:
    api_key:
      type: http
      scheme: basic
      description: |
        API key authentication. Include your access token as:
        `Authorization: Basic <ACCESS_TOKEN>`
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.bitwage.com/authorize
          tokenUrl: https://api2.bitwage.com/oauth2/token
          scopes:
            c_company_detail: Company Detail
            c_company_worker_list: Company Worker List
            c_company_worker_invitations_list: Company Worker Invitation List
            c_company_workers_invite: Company Workers Invite
            c_company_workers_pay: Company Workers Pay
            u_user_create: User Create
            u_user_update: User Update
            u_user_update_doc: User Update Document
            u_user_payer_create: User Payer Create
            u_user_payer_update: User Payer Update
            u_user_invoice_create: User Invoice Create
            u_user_invoice_delete: User Invoice Delete
            u_user_detail: User Detail
            u_user_document_list: User Document List
            u_user_payer_detail: User Payer Detail
            u_user_payer_list: User Payer List
            u_user_bank_details: User Bank Details
            u_user_invoice_detail: User Invoice Detail
            u_user_invoice_list: User Invoice List
            u_user_distribution_detail: User Distribution Detail
            u_user_distribution_list: User Distribution List
            u_user_distribution_create: User Distribution Create
            u_user_distribution_update: User Distribution Update
            u_user_kyc_initiate: User Initiate KYC

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Unique key for idempotent requests. Recommended for all write operations.

    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Unique key for idempotent write requests.

    CompanyIdPath:
      name: company_id
      in: path
      required: true
      schema:
        type: string
      description: Company ID.

    RecipientIdPath:
      name: recipient_id
      in: path
      required: true
      schema:
        type: string
      description: Recipient ID.

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Page number.

    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Number of items per page.

  responses:
    BadRequest:
      description: |
        A business rule rejected the request. Check `code` and `data.retryable`.
        Common codes include `idempotency-key-required`,
        `idempotency-key-reused-with-different-payload`, and the
        endpoint-specific codes listed in the [Errors guide](/guides/errors).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Authentication failed, the partner lacks the required permission group
        (`partner-permission-denied`), or the resource is not yours
        (`partner-company-not-found`, `invalid-api-key`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist for your account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource is in an incompatible state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: The request failed validation. Field errors are under `schema`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorBody"

  schemas:
    # ── Authorization ──
    OAuthTokenRequest:
      type: object
      required: [code, client_id, client_secret, grant_type]
      properties:
        code:
          type: string
          description: Authorization code from the `/authorize` step.
        client_id:
          type: string
          description: Your OAuth app client ID.
        client_secret:
          type: string
          description: Your OAuth app client secret.
        grant_type:
          type: string
          enum: [authorization_code]

    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        user_id:
          type: string
        company_id:
          type: string

    # ── Users ──
    UserCreateRequest:
      type: object
      required:
        - email
        - phone_number
        - phone_country
        - first_name
        - last_name
        - date_of_birth
        - street_address
        - city
        - state
        - zip
        - country
        - product
      properties:
        email:
          type: string
          format: email
        phone_number:
          type: string
          description: International format including area code. Whitespace and special characters accepted.
          example: "1 800 123 1234"
        phone_country:
          type: string
          description: 2-character ISO country code (not numeric area code).
          example: US
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          description: Format YYYY-MM-DD.
          example: "1990-01-15"
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
          description: 2-character ISO country code.
          example: US
        product:
          type: string
          enum: [worker]
          description: Only `worker` is currently supported.

    UserUpdateRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        phone_country:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string

    UserDetailResponse:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        phone_number:
          type: string
        phone_country:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        kyc_verification_status:
          type: string
        tax_id:
          type: string

    # ── User Documents ──
    UserDocumentUploadRequest:
      type: object
      required: [user_id, doc_type]
      properties:
        user_id:
          type: string
        doc_type:
          type: string
          description: |
            Document type. Use `tax_id` for tax ID submission, or one of the
            image document types for identity verification.
        category:
          type: string
          enum: [front, back]
          description: Required for image documents. Passport and proof-of-address require `front`.
        issuing_country:
          type: string
          description: 2-character ISO country code. Required for image documents.
        base64_image:
          type: string
          description: Base64-encoded image. Required for image documents.
        tax_id:
          type: string
          description: Required when `doc_type` is `tax_id`.
        tax_id_type:
          type: string
          description: Required when `doc_type` is `tax_id`.

    UserDocument:
      type: object
      properties:
        doc_type:
          type: string
        issuing_country:
          type: string

    RequiredDocTypesResponse:
      type: object
      properties:
        doc_types:
          type: array
          items:
            type: object
            properties:
              doc_type:
                type: string
              requires_backside:
                type: boolean
              requires_selfie:
                type: boolean
              requires_proof_of_address:
                type: boolean
              tax_id_types:
                type: array
                items:
                  type: string

    # ── User Payers ──
    UserPayerCreateRequest:
      type: object
      required: [user_id, company_type, payroll_invoice_currency, name, website, email]
      properties:
        user_id:
          type: string
        company_type:
          type: string
          enum: [employer, client]
        payroll_invoice_currency:
          type: string
          enum: [EUR]
          description: Must be EUR for Partner API payers.
        name:
          type: string
          description: Payer company name.
        website:
          type: string
        email:
          type: string
          format: email
        occupation:
          type: string
          description: Employer only.
        payment_amount:
          type: string
          description: Employer only.
        street_address:
          type: string
          description: Client only.
        street_address_2:
          type: string
          description: Client only.
        city:
          type: string
          description: Client only.
        region:
          type: string
          description: Client only.
        zip:
          type: string
          description: Client only.
        country:
          type: string
          description: Client only. 2-character ISO country code.

    UserPayerUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/UserPayerCreateRequest"
        - type: object
          required: [external_company_id]
          properties:
            external_company_id:
              type: string
              description: Payer ID to update.

    UserPayer:
      type: object
      properties:
        external_company_id:
          type: string
        name:
          type: string
        email:
          type: string
        company_type:
          type: string
        payroll_invoice_currency:
          type: string
        website:
          type: string

    # ── User Distributions ──
    UserDistributionCreateRequest:
      type: object
      required: [user_id, symbol, distribution_type, distribution_data]
      properties:
        user_id:
          type: string
        symbol:
          type: string
          description: Currency symbol (e.g. BTC, ETH, USD, EUR).
        distribution_type:
          type: string
          enum: [crypto, fiat]
        distribution_data:
          type: object
          description: Destination data. Shape depends on `distribution_type` and `symbol`.

    UpdateAllocationsRequest:
      type: object
      required: [user_id, allocations]
      properties:
        user_id:
          type: string
        allocations:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AllocationItem"
          description: Total allocation across all items must equal exactly 100.

    AllocationItem:
      type: object
      required: [distribution_id, allocation]
      properties:
        distribution_id:
          type: string
        allocation:
          type: integer
          minimum: 0
          maximum: 100

    UserDistribution:
      type: object
      properties:
        distribution_id:
          type: string
        user_id:
          type: string
        address:
          type: string
        symbol:
          type: string
        tag:
          type: string
        transfer_memo:
          type: string

    # ── User Funding ──
    FundingAccountCreateRequest:
      type: object
      required: [user_id, external_company_id]
      properties:
        user_id:
          type: string
        external_company_id:
          type: string
          description: Payer ID. Must reference a payer with EUR currency.

    FundingAccountUSD:
      type: object
      properties:
        USD:
          type: object
          properties:
            owner_name:
              type: string
            owner_address:
              type: string
            bank_name:
              type: string
            bank_address:
              type: string
            account_number:
              type: string
            ach_aba_number:
              type: string
            wire_aba_number:
              type: string

    FundingAccountEUR:
      type: object
      properties:
        EUR:
          type: object
          properties:
            owner_name:
              type: string
            iban:
              type: string
            account_id:
              type: string
            iban_number:
              type: string
            iso_country_code:
              type: string
            iban_check_digits:
              type: string
            account_number:
              type: string
            bank_name:
              type: string
            bank_address:
              type: string
            bank_city:
              type: string
            bank_state:
              type: string
            bank_zip:
              type: string
            bank_country:
              type: string
            unique_message:
              type: string
            swift_code_eur:
              type: string

    # ── Companies ──
    CompanyCreateRequest:
      type: object
      required:
        - legal_name
        - email
        - tax_country
        - tax_id
        - regulatory_aml
        - website_url
        - company_type
        - source_funds
        - street_address
        - city
        - state
        - zip
        - country
      properties:
        legal_name:
          type: string
        email:
          type: string
          format: email
        dba:
          type: string
        tax_country:
          type: string
        tax_state:
          type: string
        tax_id:
          type: string
        regulatory_aml:
          type: string
        website_url:
          type: string
        company_type:
          type: string
        source_funds:
          type: string
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string

    CompanyCreateResponse:
      type: object
      properties:
        company_id:
          type: string
        status:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    CompanyDetailResponse:
      type: object
      properties:
        company_id:
          type: string
        legal_name:
          type: string
        has_default_funding_method:
          type: boolean
        kyc_verification_status:
          type: string

    UboCreateRequest:
      type: object
      required:
        - email
        - phone_number
        - phone_country
        - first_name
        - last_name
        - date_of_birth
        - street_address
        - city
        - state
        - zip
        - country
      properties:
        email:
          type: string
          format: email
        phone_number:
          type: string
        phone_country:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string

    CompanyDocumentUploadRequest:
      type: object
      required: [target_type]
      properties:
        target_type:
          type: string
          enum: [company, ubo_admin]
          description: Determines which document destination and required fields.
        doc_type:
          type: string
          description: Required for `ubo_admin` target.
        category:
          type: string
          description: Required for `ubo_admin` image uploads.
        issuing_country:
          type: string
          description: Required for `ubo_admin` image uploads.
        base64_image:
          type: string
          description: Required for `ubo_admin` image uploads or `company` file uploads.
        tax_id:
          type: string
          description: Required for `ubo_admin` tax_id doc_type.
        tax_id_type:
          type: string
          description: Required for `ubo_admin` tax_id doc_type.
        request_id:
          type: string
          description: Required for `company` target. The document request ID.
        answer:
          type: string
          description: For `company` target text-based answers.
        file_name:
          type: string
          description: Required for `company` target when uploading a file.

    CompanyDocumentUploadResponse:
      type: object
      properties:
        company_id:
          type: string
        status:
          type: string
        target_type:
          type: string
        doc_type:
          type: string
        request_id:
          type: string

    CompanyKybResponse:
      type: object
      properties:
        company_id:
          type: string
        kyb_status:
          type: string
        requirements:
          type: object
          properties:
            missing_fields:
              type: array
              items:
                type: string
            has_ubo_admin:
              type: boolean
            has_beneficial_owner:
              type: boolean
            has_ubo_kyc_initiated:
              type: boolean
            has_ubo_documents:
              type: boolean
            outstanding:
              type: array
              items:
                type: string
        rejection_reasons:
          type: array
          items:
            type: string

    # ── Company Workers ──
    Worker:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        onboarding_complete:
          type: boolean
        has_distributions:
