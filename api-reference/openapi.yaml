        - phone_country
        - first_name
        - last_name
        - date_of_birth
        - street_address
        - city
        - state
        - zip
        - country
      properties:
        email:
          type: string
          format: email
        phone_number:
          type: string
        phone_country:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string

    RecipientVendorPayload:
      type: object
      required:
        - legal_name
        - email
        - tax_country
        - tax_id
        - regulatory_aml
        - website_url
        - company_type
        - source_funds
        - street_address
        - city
        - state
        - zip
        - country
      properties:
        legal_name:
          type: string
        email:
          type: string
          format: email
        dba:
          type: string
        tax_country:
          type: string
        tax_state:
          type: string
        tax_id:
          type: string
        regulatory_aml:
          type: string
        website_url:
          type: string
        company_type:
          type: string
        source_funds:
          type: string
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string

    RecipientCreateResponse:
      type: object
      properties:
        recipient_id:
          type: string
        recipient_type:
          type: string
        relationship_id:
          type: string
        status:
          type: string
        idempotency_replayed:
          type: boolean

    RecipientDistributionCreateRequest:
      type: object
      required: [symbol, distribution_type, distribution_data]
      properties:
        symbol:
          type: string
          description: Currency symbol (e.g. BTC, ETH, USD, EUR).
        distribution_type:
          type: string
          enum: [crypto, fiat]
        distribution_data:
          type: object
          description: Destination data. Shape depends on `distribution_type` and `symbol`.

    Recipient:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        recipient_type:
          type: string
        status:
          type: string
        country:
          type: string
        external_id:
          type: string
        department:
          type: string
        vendor_type:
          type: string
        created:
          type: string
          format: date

    # ── Wallets ──
    WalletRequest:
      type: object
      required: [company_id, currency]
      properties:
        company_id:
          type: string
          description: Company ID that the wallet should be requested for.
        currency:
          type: string
          description: Wallet currency, for example `USD` or `EUR`.

    WalletRequestResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, completed, rejected]

    WalletStatusListResponse:
      type: object
      properties:
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/WalletStatus"

    WalletStatus:
      type: object
      properties:
        provider:
          type: string
          example: bvnk
        currency:
          type: string
          example: USD
        account_type:
          type: string
          enum: [fiat, crypto]
        rail:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, rejected]
        is_available_for_payroll_funding:
          type: boolean
        account:
          oneOf:
            - $ref: "#/components/schemas/Wallet"
            - type: "null"

    Wallet:
      type: object
      properties:
        id:
          type: string
          description: Wallet funding method ID.
          example: custodial_account_123
        balance:
          type: string
        is_payroll_funding_default:
          type: boolean
        transactions:
          type: array
          items:
            type: object
        deposit_info:
          type: array
          items:
            type: object
        decimals:
          type: integer

    WalletFundingWalletsResponse:
      type: object
      properties:
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/FundingWallet"

    FundingWallet:
      type: object
      properties:
        id:
          type: string
          description: Use this value as `funding_method` for vendor quote and payroll creation.
          example: custodial_account_123
        balance:
          type: string
        currency:
          type: string
        is_default:
          type: boolean
        status:
          type: string
          enum: [pending, in_progress, completed, rejected]

    # ── Company Payroll ──
    PayrollCreateRequest:
      type: object
      required: [company_id, to_pay]
      properties:
        company_id:
          type: string
        to_pay:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PayrollPaymentItem"
        funding_method:
          type: string
          description: |
            How the payroll is funded, for example `wire`, `international_wire`, or `ach_credit`. Send it on every request.
            If you omit it, Bitwage uses the company's default funding method, which partners can't set, and the request fails with a `422` when none exists.
        funding_currency:
          type: string
          description: Funding currency for crypto payments.
        currency:
          type: string
          description: Payroll denomination currency.
        external_id:
          type: string
          description: Your external reference ID for this payroll.

    PayrollPaymentItem:
      type: object
      required: [amount_fiat]
      properties:
        amount_fiat:
          type: number
          format: double
          description: Payment amount in fiat currency.
        user_id:
          type: string
          description: Recipient user ID. One of `user_id` or `company_id` is required.
        company_id:
          type: string
          description: Recipient company ID. One of `user_id` or `company_id` is required.
        country:
          type: string
        is_premium:
          type: boolean
          default: false
        invoice_id:
          type: string
        description:
          type: string
        category:
          type: string
        external_payment_id:
          type: string

    PayrollCreateResponse:
      type: object
      properties:
        payroll_id:
          type: string
        fees:
          type: number
          format: double
        volume_input_in_input_currency:
          type: number
          format: double
        total_input_in_input_currency:
          type: number
          format: double
        quote:
          $ref: "#/components/schemas/PayrollQuote"

    PayrollStatus:
      type: string
      enum: [created, received, processing, fulfilled, canceled]
      description: |
        Payroll status.

        - `created`: the payroll exists and is waiting for funds.
        - `received`: Bitwage received the funding.
        - `processing`: the payroll is approved or released and payments are in flight.
        - `fulfilled`: all payments are complete.
        - `canceled`: the payroll was canceled or deleted.

    PartnerPayroll:
      type: object
      properties:
        payroll_id:
          type: string
        company_id:
          type: string
        external_id:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/PayrollStatus"
        created:
          type: string
          format: date-time
          nullable: true
        datereceived:
          type: string
          format: date-time
          nullable: true
        dateapproved:
          type: string
          format: date-time
          nullable: true
        datereleased:
          type: string
          format: date-time
          nullable: true
        datefulfilled:
          type: string
          format: date-time
          nullable: true
        datecanceled:
          type: string
          format: date-time
          nullable: true
        invoice_ids:
          type: array
          nullable: true
          description: Claim IDs linked to the payroll, or null.
          items:
            type: string
        payments:
          type: array
          description: |
            Same object as `payment` on `user.payment_status_update`, not the
            summary sent on `company.payroll_status`.
          items:
            $ref: "#/components/schemas/Payment"

    PayrollQuote:
      type: object
      properties:
        quote_id:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        rate:
          type: number
          format: double
        funding_currency:
          type: string
        funding_amount:
          type: number
          format: double
        funding_details:
          $ref: "#/components/schemas/FundingDetails"

    PayrollQuoteRefreshResponse:
      type: object
      properties:
        payroll_id:
          type: string
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/PayrollQuoteRefreshQuote"

    PayrollQuoteRefreshQuote:
      type: object
      properties:
        quote_id:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        rate:
          type: number
          format: double
        funding_currency:
          type: string
        funding_amount:
          type: number
          format: double
        funding_details:
          $ref: "#/components/schemas/FundingDetails"

    FundingDetails:
      type: object
      properties:
        address:
          type: string
          description: Crypto address for funding.
        network:
          type: string
          description: Blockchain network.

    # ── Vendor Payroll ──
    VendorPayrollQuotesRequest:
      type: object
      required: [company_id, funding_currency, funding_method, vendor_payment_quotes]
      properties:
        company_id:
          type: string
          description: Company ID that the vendor payroll quotes are being created for.
        funding_currency:
          type: string
          description: Currency of the wallet used for funding.
          example: USD
        funding_method:
          type: string
          description: Concrete wallet funding method ID.
          example: custodial_account_123
        vendor_payment_quotes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VendorPaymentQuoteItem"

    VendorPaymentQuoteItem:
      type: object
      required: [vendor_id, distribution_id, receiving_amount, receiving_currency]
      properties:
        vendor_id:
          type: string
          description: Vendor recipient company ID.
        distribution_id:
          type: string
          description: Vendor distribution ID.
        receiving_amount:
          type: number
          format: double
          description: Amount the vendor should receive.
        receiving_currency:
          type: string
          description: Currency the vendor should receive.

    VendorPayrollQuotesResponse:
      type: object
      properties:
        company_quotes:
          type: array
          items:
            $ref: "#/components/schemas/VendorQuote"
        vendor_quotes:
          type: array
          items:
            $ref: "#/components/schemas/VendorQuote"
        fees:
          $ref: "#/components/schemas/VendorPayrollFees"

    VendorQuote:
      type: object
      properties:
        id:
          type: string
        vendor_id:
          type: string
        distribution_id:
          type: string
        base_currency:
          type: string
        quote_currency:
          type: string
        sell_rate:
          type: number
          format: double
        buy_rate:
          type: number
          format: double
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        base_amount:
          type: number
          format: double
        quote_amount:
          type: number
          format: double
        base_amount_subtotal:
          type: number
          format: double
        total_fees_in_base_currency:
          type: number
          format: double
        percent_fee:
          type: number
          format: double
        processing_fees_in_base_currency:
          type: number
          format: double
        flat_fees_in_base_currency:
          type: number
          format: double

    VendorPayrollFees:
      type: object
      properties:
        all_fees_in_input_currency:
          type: number
          format: double
        subtotal_in_input_currency:
          type: number
          format: double
        total_amount_in_input_currency:
          type: number
          format: double

    VendorPayrollDocumentUploadRequest:
      type: object
      required: [company_id, filename, content_type]
      properties:
        company_id:
          type: string
          description: Company ID that the vendor document is being uploaded for.
        filename:
          type: string
          description: Original invoice file name.
          example: invoice-1001.pdf
        content_type:
          type: string
          description: MIME type for the invoice file. Only PDF uploads are supported.
          enum: [application/pdf]

    VendorPayrollDocumentUploadResponse:
      type: object
      properties:
        invoice_upload_id:
          type: string
          description: Upload ID to pass on the vendor payroll payment item.
        upload_url:
          type: string
          format: uri
          description: Presigned URL for uploading the invoice file.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers to include when uploading the file.
        temp_s3_key:
          type: string
          description: Temporary object key for the uploaded invoice.
        expires_at:
          type: string
          format: date-time
          description: Time when the upload session expires.

    VendorPayrollCreateRequest:
      type: object
      required: [company_id, funding_currency, funding_method, vendor_payments]
      properties:
        company_id:
          type: string
          description: Company ID that the vendor payroll is being created for.
        name:
          type: string
          description: Optional display name for the vendor payroll.
        funding_currency:
          type: string
          description: Currency of the wallet used for funding.
          example: USD
        funding_method:
          type: string
          description: Concrete wallet funding method ID.
          example: custodial_account_123
        vendor_payments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VendorPaymentItem"

    VendorPaymentItem:
      type: object
      required: [vendor_id, quote_id]
      properties:
        vendor_id:
          type: string
          description: Vendor recipient company ID.
        quote_id:
          type: string
          description: Quote ID returned by the vendor payroll quote endpoint.
        invoice_upload_id:
          type: string
          description: Invoice upload ID returned by the document upload endpoint. Required when the vendor payment USD subtotal is greater than or equal to 15000.
        reference_metadata:
          $ref: "#/components/schemas/VendorPaymentReferenceMetadata"

    VendorPaymentReferenceMetadata:
      type: object
      properties:
        invoice_number:
          type: string
        invoice_date:
          type: string
        due_date:
          type: string
        memo:
          type: string

    VendorPayrollCreateResponse:
      type: object
      properties:
        payroll_id:
          type: string
        name:
          type: string
        payment_mode:
          type: string
          example: vendor
        currency:
          type: string
        volume_input_in_input_currency:
          type: number
          format: double
        created:
          type: string
          format: date-time

    # ── Merchant ──
    MerchantClaimCreateRequest:
      type: object
      required: [payer_id, amount, denomination_currency, funding_currency]
      properties:
        payer_id:
          type: string
        amount:
          type: number
        denomination_currency:
          type: string
        funding_currency:
          type: string

    MerchantClaimCreateResponse:
      type: object
      properties:
        claim_id:
          type: string
        quote_id:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        rate:
          type: string
        denomination_currency:
          type: string
        funding_currency:
          type: string
        denomination_amount:
          type: string
        funding_amount:
          type: string
        funding_details:
          $ref: "#/components/schemas/FundingDetails"

    MerchantClaimQuoteRefreshRequest:
      type: object
      required: [company_id, claim_id]
      properties:
        company_id:
          type: string
        claim_id:
          type: string

    MerchantClaimQuoteRefreshResponse:
      type: object
      properties:
        claim_id:
          type: string
        quote_id:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        rate:
          type: string
        denomination_currency:
          type: string
        funding_currency:
          type: string
        denomination_amount:
          type: string
        funding_amount:
          type: string
        funding_details:
          $ref: "#/components/schemas/FundingDetails"

    MerchantClaimStatusResponse:
      type: object
      properties:
        claim_id:
          type: string
        status:
          type: string
        tx_hash:
          type: string

    # ── Shared / Webhook ──
    Payment:
      type: object
      properties:
        subpayroll_id:
          type: string
        received:
          type: boolean
        received_at:
          type: string
          format: date-time
          nullable: true
        released:
          type: boolean
        released_at:
          type: string
          format: date-time
          nullable: true
        fulfilled:
          type: boolean
        fulfilled_at:
          type: string
          format: date-time
          nullable: true
        receiver_user_id:
          type: string
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAllocation"

    PaymentAllocation:
      type: object
      properties:
        input_currency:
          type: string
        output_currency:
          type: string
        volume_input_in_input_currency:
          type: number
          format: double
        volume_output_in_output_currency:
          type: number
          format: double
        fees:
          type: number
          format: double
        spread:
          type: number
          format: double
        tx_hash:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        has_prev:
          type: boolean
        has_next:
          type: boolean
        prev_num:
          type: integer
        next_num:
          type: integer
        per_page:
          type: integer

    Error:
      type: object
      description: |
        Error body returned by most endpoints. Branch on `code`. See the
        [Errors guide](/guides/errors) for the full list of codes.
      required: [request_id, message]
      properties:
        request_id:
          type: string
          description: Include this when you contact support.
        message:
          type: string
          description: English fallback text. Can change.
        code:
          type: string
          description: Stable kebab-case error code. Omitted when there is none.
          example: recipient-worker-email-already-exists
        data:
          type: object
          description: Extra fields. Most `400` errors include `retryable`.
          properties:
            retryable:
              type: boolean
          additionalProperties: true

    ValidationErrorBody:
      type: object
      required: [request_id, message, schema]
      properties:
        request_id:
          type: string
        message:
          type: string
          description: The first error in `schema`.
        code:
          type: string
        schema:
          type: object
          description: Validation errors keyed by field name. Nested fields are nested.
          additionalProperties: true
          example:
            payments: ["Total amount of payroll must be greater than 10"]

    LegacyError:
      type: object
      description: Body returned by older `/api/user/*` endpoints with HTTP 400.
      properties:
        error:
          type: string
